server:
  port: 8083
  ssl:
    key-store: file:/app/certs/payment.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: PKCS12
    trust-store: file:/app/certs/truststore.p12
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD}
    trust-store-type: PKCS12
    client-auth: want

mtls:
  key-store: file:/app/certs/payment.p12
  key-store-password: ${SSL_PASSWORD}
  trust-store: file:/app/certs/truststore.p12
  trust-store-password: ${SSL_TRUST_STORE_PASSWORD}
spring:
  datasource:
    url: jdbc:postgresql://payment-db:5432/payment_db
    username: user_admin
    password: root_password
  application:
    name: payment-service
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        scheme: https
        health-check-url: https://payment-service:8083/actuator/health
        health-check-tls-skip-verify: true
        register: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans    
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"  # 👈 logs con traceId

resilience4j:
  circuitbreaker:
    instances:
      walletService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      wallet-service:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException.BadRequest
          - feign.FeignException.Unauthorized
          - feign.FeignException.NotFound

  timelimiter:
    instances:
      wallet-service:
        timeout-duration: 5s
      