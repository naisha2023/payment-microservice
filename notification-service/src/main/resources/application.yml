server:
  port: 8085
mtls:
  key-store: file:/app/certs/client.p12
  key-store-password: ${SSL_PASSWORD}
  trust-store: file:/app/certs/truststore.p12
  trust-store-password: ${SSL_TRUST_STORE_PASSWORD}

auth-service:
  base-url: https://auth-service:8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
    username: user_admin
    password: root_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: leo.santi.cuba@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: notification-service
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        scheme: http
        health-check-url: http://notification-service:8085/actuator/health
        health-check-tls-skip-verify: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.example.shared.events,org.example.*"

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
                include: health,info,metrics,prometheus
  prometheus:
        metrics:
            export:
                enabled: true
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"  # 👈 logs con traceId
