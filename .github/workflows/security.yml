name: Security

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Maven Dependency Scan
        run: mvn -B clean verify

  trivy-scan:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan repository filesystem
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .

      - name: Build images
        run: docker compose build

      - name: Trivy payment-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-payment-service:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy auth-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-auth-service:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy wallet-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-wallet-service:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy ledger-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-ledger-service:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy notification-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-notification-service:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy api-gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wallet-service-root-api-gateway:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1      