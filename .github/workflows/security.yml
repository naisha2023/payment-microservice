name: Security

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Maven Dependency Scan
        run: mvn -B clean verify

  trivy-scan:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Remove generated build artifacts before Trivy FS scan
        run: |
          find . -type d -name target -prune -exec rm -rf {} +

      - name: Verify versions
        run: |
          mvn dependency:tree -Dincludes=org.postgresql
          mvn dependency:tree -Dincludes=io.netty

      - name: Scan Maven files
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            pom.xml auth-service/pom.xml wallet-service/pom.xml payment-service/pom.xml ledger-service/pom.xml notification-service/pom.xml shared/pom.xml

      - name: Build images
        run: docker compose build

      - name: Trivy payment-service
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-payment-service:latest

      - name: Trivy auth-service
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-auth-service:latest

      - name: Trivy wallet-service
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-wallet-service:latest

      - name: Trivy ledger-service
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-ledger-service:latest

      - name: Trivy notification-service
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-notification-service:latest

      - name: Trivy api-gateway
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed wallet-service-root-api-gateway:latest