name: Security

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install shared module
        run: mvn -B install -pl shared -am -DskipTests

      - name: Maven Dependency Scan
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -pl auth-service,wallet-service,payment-service,ledger-service,notification-service

  trivy-scan:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Build Docker Images
        run: docker compose build
      
      - name: List compose images
        run: docker compose images

      - name: Trivy payment-service
        id: trivy_payment
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-payment.txt \
            payment-service:latest

      - name: Trivy auth-service
        id: trivy_auth
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-auth.txt \
            auth-service:latest

      - name: Trivy wallet-service
        id: trivy_wallet
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-wallet.txt \
            wallet-service:latest

      - name: Trivy ledger-service
        id: trivy_ledger
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-ledger.txt \
            ledger-service:latest

      - name: Trivy notification-service
        id: trivy_notification
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-notification.txt \
            notification-service:latest

      - name: Trivy api-gateway
        id: trivy_gateway
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-gateway.txt \
            api-gateway:latest

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.txt

      - name: Check all Trivy results
        run: |
          failed=0

          [ "${{ steps.trivy_payment.outcome }}"      = "failure" ] && failed=1
          [ "${{ steps.trivy_auth.outcome }}"         = "failure" ] && failed=1
          [ "${{ steps.trivy_wallet.outcome }}"       = "failure" ] && failed=1
          [ "${{ steps.trivy_ledger.outcome }}"       = "failure" ] && failed=1
          [ "${{ steps.trivy_notification.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.trivy_gateway.outcome }}"      = "failure" ] && failed=1

          if [ $failed -eq 1 ]; then
            echo "❌ Vulnerabilities HIGH/CRITICAL found in one or more images"
            exit 1
          fi

          echo "✅ No HIGH/CRITICAL vulnerabilities found"