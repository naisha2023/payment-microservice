server:
  port: 8080
  ssl:
    key-store: file:/app/certs/gateway.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: PKCS12
    trust-store: file:/app/certs/truststore.p12
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD}
    trust-store-type: PKCS12
jwt:
  secret: ${JWT_SECRET}
spring:
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis                         
    redis:
      time-to-live: 600000 
  application:
    name: api-gateway

  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        hostname: api-gateway
        health-check-url: https://api-gateway:8080/actuator/health  # 👈 https
        health-check-interval: 10s

    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"     
                  - "http://localhost:4200"
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - "X-Correlation-ID"
                allow-credentials: true
                max-age: 3600
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: wallet-service
              uri: lb://wallet-service
              predicates:
                - Path=/api/wallets/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: http://payment-service:8083
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
        metrics:
            export:
                enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3   
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans                       # 👈 necesario en Spring Boot 4

logging:
  level:
    org:
      springframework:
        security: DEBUG
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"  # 👈 logs con traceId

  endpoints:
    web:
      exposure:
        include: health,info,gateway