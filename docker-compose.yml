services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: auth_db

    secrets:
      - db_password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - data-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    secrets:
      - rabbitmq_password

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - messaging-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    secrets:
      - redis_password

    command: >
      sh -c "redis-server --requirepass $$(cat /run/secrets/redis_password)"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - gateway-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    secrets:
      - grafana_password

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning

    networks:
      - monitoring-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8081:8081"

    secrets:
      - jwt_secret
      - db_password
      - rabbitmq_password
      - ssl_password
      - truststore_password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SSL_PASSWORD_FILE: /run/secrets/ssl_password
      SSL_TRUST_STORE_PASSWORD_FILE: /run/secrets/truststore_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    volumes:
      - ./certs/server.p12:/app/certs/server.p12:ro
      - ./certs/truststore.p12:/app/certs/truststore.p12:ro

    networks:
      - services-network
      - data-network
      - messaging-network

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile

    container_name: wallet-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8082:8082"

    secrets:
      - jwt_secret
      - db_password
      - rabbitmq_password
      - ssl_password
      - truststore_password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SSL_PASSWORD_FILE: /run/secrets/ssl_password
      SSL_TRUST_STORE_PASSWORD_FILE: /run/secrets/truststore_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    volumes:
      - ./certs/wallet.p12:/app/certs/wallet.p12:ro
      - ./certs/truststore.p12:/app/certs/truststore.p12:ro

    networks:
      - services-network
      - data-network
      - messaging-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile

    container_name: payment-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_started

    ports:
      - "8083:8083"

    secrets:
      - jwt_secret
      - db_password
      - rabbitmq_password
      - ssl_password
      - truststore_password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SSL_PASSWORD_FILE: /run/secrets/ssl_password
      SSL_TRUST_STORE_PASSWORD_FILE: /run/secrets/truststore_password

      SERVICES_WALLET_BASE_URL: https://wallet-service:8082
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    volumes:
      - ./certs/payment.p12:/app/certs/payment.p12:ro
      - ./certs/truststore.p12:/app/certs/truststore.p12:ro

    networks:
      - services-network
      - data-network
      - messaging-network

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile

    container_name: ledger-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8084:8084"

    secrets:
      - jwt_secret
      - db_password
      - rabbitmq_password
      - ssl_password
      - truststore_password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SSL_PASSWORD_FILE: /run/secrets/ssl_password
      SSL_TRUST_STORE_PASSWORD_FILE: /run/secrets/truststore_password

      SERVER_PORT: 8084
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    networks:
      - services-network
      - data-network
      - messaging-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile

    container_name: notification-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8085:8085"

    secrets:
      - jwt_secret
      - db_password
      - rabbitmq_password
      - mail_password
      - ssl_password
      - truststore_password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

      MAIL_PASSWORD_FILE: /run/secrets/mail_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SSL_PASSWORD_FILE: /run/secrets/ssl_password
      SSL_TRUST_STORE_PASSWORD_FILE: /run/secrets/truststore_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    volumes:
      - ./certs/client.p12:/app/certs/client.p12:ro
      - ./certs/truststore.p12:/app/certs/truststore.p12:ro

    networks:
      - services-network
      - data-network
      - messaging-network

  api-gateway:
    build:
      context: ./fintech-gateway
      dockerfile: Dockerfile

    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    secrets:
      - jwt_secret
      - redis_password

    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password

      GATEWAY_CERT_PATH: /app/certs/gateway.crt
      GATEWAY_KEY_PATH: /app/certs/gateway.key
      GATEWAY_CLIENT_CERT_PATH: /app/certs/gateway.crt
      GATEWAY_CLIENT_KEY_PATH: /app/certs/gateway.key
      GATEWAY_CA_PATH: /app/certs/truststore.pem
      GATEWAY_SERVER_CERT_PATH: /app/certs/gateway.crt
      GATEWAY_SERVER_KEY_PATH: /app/certs/gateway.key

    volumes:
      - ./fintech-gateway/certs:/app/certs:ro

    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      wallet-service:
        condition: service_started
      payment-service:
        condition: service_started

    networks:
      - gateway-network
      - services-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    networks:
      - services-network
      - monitoring-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped

    ports:
      - "9411:9411"

    networks:
      - services-network
      - monitoring-network

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki-data:/loki

    command: -config.file=/etc/loki/local-config.yml

    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped

    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command: -config.file=/etc/promtail/config.yml

    depends_on:
      - loki

    networks:
      - monitoring-network

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  gateway-network:
    driver: bridge
  services-network:
    driver: bridge
  data-network:
    driver: bridge
  messaging-network:
    driver: bridge
  monitoring-network:
    driver: bridge

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

  db_password:
    file: ./secrets/db_password.txt

  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt

  redis_password:
    file: ./secrets/redis_password.txt

  grafana_password:
    file: ./secrets/grafana_password.txt

  mail_password:
    file: ./secrets/mail_password.txt

  ssl_password:
    file: ./secrets/ssl_password.txt

  truststore_password:
    file: ./secrets/truststore_password.txt