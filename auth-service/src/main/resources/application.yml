server:
  port: 8081
  address: 0.0.0.0
  ssl:
    enabled: true
    key-store: file:/app/certs/server.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: PKCS12
    trust-store: file:/app/certs/truststore.p12
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD}
    trust-store-type: PKCS12
    client-auth: want

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
    username: user_admin
    password: root_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123

  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        scheme: https
        health-check-url: https://auth-service:8081/actuator/health
        health-check-tls-skip-verify: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.example.authservice: DEBUG
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "